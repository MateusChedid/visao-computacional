# config_h100.yaml — Otimizado para NVIDIA H100 80GB
# RPG Dice CV v2 — d6, d8, d10, d12, d20

model: yolov8l.pt 
epochs: 150
patience: 25
batch: 48 
imgsz: 640
workers: 8

optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8

# Augmentation online
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 180.0
translate: 0.1
scale: 0.3
shear: 5.0
flipud: 0.3
fliplr: 0.5
mosaic: 0.8
mixup: 0.1
copy_paste: 0.1

# Loss weights
box: 7.5
cls: 0.5
dfl: 1.5


amp: true

cache: ram

save: true
save_period: 10
plots: true
verbose: true
val: true

# Inferência
conf_threshold: 0.45
iou_threshold: 0.45
max_det: 20


drive_zip_id: "1Zb3Wmu4uTaL-_4BA41JewOvsW7oBkZox" 
